---
# Grafana dashboards shipped as ConfigMaps — picked up by the kube-prometheus-stack
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-nvidia-dcgm-exporter
    files:
      - nvidia-dcgm-exporter.json
  # llm-d official: EPP / InferencePool view
  - name: dashboard-llm-d-inference-gateway
    files:
      - llm-d-inference-gateway.json
  # vLLM official: TTFT, TPOT, throughput, cache hit rate
  - name: dashboard-vllm
    files:
      - vllm.json
