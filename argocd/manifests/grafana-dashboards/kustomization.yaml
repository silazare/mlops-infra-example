---
# Grafana dashboards shipped as ConfigMaps — picked up by the kube-prometheus-stack
# Grafana dashboard sidecar (watches label grafana_dashboard: "1", default-on in the chart).
# Add a dashboard = drop a .json here + add a configMapGenerator entry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-nvidia-dcgm-exporter
    files:
      - nvidia-dcgm-exporter.json
