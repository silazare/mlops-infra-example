---
# Custom DCGM metric set for dcgm-exporter (gpu-operator).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-metrics-custom
  namespace: gpu-operator
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: nvidia-gpu-operator
data:
  dcgm-metrics.csv: |
    # DCGM FIELD, Prometheus type, help

    # Clocks
    DCGM_FI_DEV_SM_CLOCK,  gauge, SM clock frequency (in MHz).
    DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).

    # Temperature
    DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).
    DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).

    # Power
    DCGM_FI_DEV_POWER_USAGE,              gauge,   Power draw (in W).
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).
    DCGM_FI_DEV_POWER_MGMT_LIMIT,         gauge,   Power management limit (in W).

    # Utilization
    DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).
    DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory-copy utilization (in %).
    DCGM_FI_DEV_ENC_UTIL,      gauge, Encoder utilization (in %).
    DCGM_FI_DEV_DEC_UTIL,      gauge, Decoder utilization (in %).

    # Memory
    DCGM_FI_DEV_FB_FREE,     gauge, Framebuffer memory free (in MiB).
    DCGM_FI_DEV_FB_USED,     gauge, Framebuffer memory used (in MiB).
    DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved (in MiB).
    DCGM_FI_DEV_FB_TOTAL,    gauge, Total framebuffer memory (in MiB).

    # HW health: ECC row remap
    DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Remapped rows for uncorrectable errors.
    DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS,   counter, Remapped rows for correctable errors.
    DCGM_FI_DEV_ROW_REMAP_FAILURE,           gauge,   Whether row remapping has failed.

    # Link health
    DCGM_FI_DEV_PCIE_REPLAY_COUNTER,    counter, Total number of PCIe retries.
    DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, counter, Total NVLink bandwidth all lanes.

    # Throttle / violations
    DCGM_FI_DEV_CLOCKS_EVENT_REASONS, gauge,   Current clocks-event (throttle) reasons bitmask.
    DCGM_FI_DEV_POWER_VIOLATION,      counter, Throttle duration due to power (in us).
    DCGM_FI_DEV_THERMAL_VIOLATION,    counter, Throttle duration due to thermal (in us).

    # vGPU
    DCGM_FI_DEV_VGPU_LICENSE_STATUS, gauge, vGPU license status.

    # DCP / profiling - critical productivity signals
    DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge, Ratio of time the graphics engine is active.
    DCGM_FI_PROF_SM_ACTIVE,          gauge, Ratio of cycles an SM has >=1 warp assigned.
    DCGM_FI_PROF_SM_OCCUPANCY,       gauge, Ratio of resident warps to the max supported.
    DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
    DCGM_FI_PROF_DRAM_ACTIVE,        gauge, Ratio of cycles the memory interface is active.
    DCGM_FI_PROF_PCIE_TX_BYTES,      gauge, PCIe TX bytes/sec.
    DCGM_FI_PROF_PCIE_RX_BYTES,      gauge, PCIe RX bytes/sec.

    # DCP / profiling - NVLink (empty on g4dn/g5 T4/A10, populates on NVLink cards)
    DCGM_FI_PROF_NVLINK_TX_BYTES, gauge, NVLink TX bytes/sec.
    DCGM_FI_PROF_NVLINK_RX_BYTES, gauge, NVLink RX bytes/sec.
