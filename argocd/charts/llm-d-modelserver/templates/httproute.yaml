{{- if .Values.gateway.enabled }}
# HTTPRoute — "/" -> this model's InferencePool
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.resourceName }}-route
  namespace: {{ .Release.Namespace }}
  annotations:
    # Apply later after InferencePool exists
    argocd.argoproj.io/sync-wave: "10"
  labels:
    {{- include "llm-d-modelserver.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.resourceName }}-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ .Values.resourceName }}
          weight: 100
{{- end }}
