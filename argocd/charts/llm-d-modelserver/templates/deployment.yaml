apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.resourceName }}-decode
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-modelserver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "llm-d-modelserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-d-modelserver.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.resourceName }}-sa
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: modelserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["vllm", "serve"]
          args:
            - {{ .Values.model | quote }}
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size={{ .Values.tensorParallelSize }}"
            - "--max-model-len={{ .Values.maxModelLen }}"
            - "--gpu-memory-utilization={{ .Values.gpuMemUtil }}"
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: USER
              value: llm-d
            - name: HF_HOME
              value: /model-cache
            {{- if .Values.hfTokenSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfTokenSecret }}
                  key: HF_TOKEN
            {{- end }}
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              nvidia.com/gpu: {{ .Values.gpu }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              nvidia.com/gpu: {{ .Values.gpu }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /model-cache
              name: model-cache
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: model-cache
          {{- if .Values.modelCache.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.resourceName }}-model-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
