{{- if .Values.gateway.enabled }}
# Istio Gateway — istiod auto-provisions the Envoy Deployment + Service.
# networking.istio.io/service-type pins that Service to ClusterIP
#
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.resourceName }}-gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    networking.istio.io/service-type: {{ .Values.gateway.serviceType | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
