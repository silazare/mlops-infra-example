---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            enable_monitoring: "true"
  template:
    metadata:
      name: kube-prometheus-stack
      # Cascade-delete child resources when the ApplicationSet is removed
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        # Kube-prometheus-stack Helm Chart
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 87.17.0
          helm:
            valueFiles:
              - $values/argocd/helm-values/kube-prometheus-stack/values.yaml
        # Kube-prometheus-stack values from Git
        - repoURL: https://github.com/silazare/mlops-infra-example
          targetRevision: '{{ index .metadata.annotations "target_revision" }}'
          ref: values
        # Grafana dashboards as ConfigMaps (kustomize) — picked up by the dashboard sidecar
        - repoURL: https://github.com/silazare/mlops-infra-example
          targetRevision: '{{ index .metadata.annotations "target_revision" }}'
          path: argocd/manifests/grafana-dashboards
        # ServiceMonitors/PodMonitors for out-of-chart components (vLLM, EPP, Istio)
        - repoURL: https://github.com/silazare/mlops-infra-example
          targetRevision: '{{ index .metadata.annotations "target_revision" }}'
          path: argocd/manifests/prometheus-monitors
      destination:
        server: "{{ .server }}"
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
