---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storage-classes
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: storage-classes
      # Cascade-delete managed StorageClasses when the ApplicationSet is removed
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/silazare/mlops-infra-example
        targetRevision: "{{metadata.annotations.target_revision}}"
        # Raw K8s manifests
        path: argocd/manifests/storage-classes
        directory:
          recurse: true
      destination:
        server: "{{server}}"
        # StorageClass is cluster-scoped
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
