---
# metrics-server: resource metrics API for HPA and kubectl top
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metrics-server
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            enable_metrics_server: "true"
  template:
    metadata:
      name: metrics-server
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://kubernetes-sigs.github.io/metrics-server
          chart: metrics-server
          targetRevision: 3.13.0
          helm:
            releaseName: metrics-server
            valueFiles:
              - $values/argocd/helm-values/metrics-server/values.yaml
        - repoURL: https://github.com/silazare/mlops-infra-example
          targetRevision: '{{ index .metadata.annotations "target_revision" }}'
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
