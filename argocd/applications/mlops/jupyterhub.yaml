---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jupyterhub
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            enable_jupyterhub: "true"
  template:
    metadata:
      name: jupyterhub
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://hub.jupyter.org/helm-chart/
          chart: jupyterhub
          targetRevision: 4.3.5
          helm:
            releaseName: jupyterhub
            valueFiles:
              - $values/argocd/helm-values/jupyterhub/values.yaml
        - repoURL: https://github.com/silazare/mlops-infra-example
          targetRevision: "{{metadata.annotations.target_revision}}"
          ref: values
      destination:
        server: "{{server}}"
        namespace: jupyterhub
      # The chart auto-generates secret tokens via randAlphaNum on each render
      # The hub/proxy pod-template checksum annotations drift every sync
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: hub
          namespace: jupyterhub
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1secret
        - group: apps
          kind: Deployment
          name: proxy
          namespace: jupyterhub
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1auth-token
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
