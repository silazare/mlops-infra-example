---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jupyterhub
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            enable_jupyterhub: "true"
  template:
    metadata:
      name: jupyterhub
      annotations:
        argocd.argoproj.io/sync-wave: "3"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://hub.jupyter.org/helm-chart/
          chart: jupyterhub
          targetRevision: 4.3.5
          helm:
            releaseName: jupyterhub
            valueFiles:
              - $values/argocd/helm-values/jupyterhub/values.yaml
        - repoURL: https://github.com/silazare/mlops-infra-example
          targetRevision: '{{ index .metadata.annotations "target_revision" }}'
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: jupyterhub
      # The chart auto-generates 3 secret tokens into Secret `hub` via randAlphaNum on each render
      # The hub/proxy pod-template checksum annotations drift every sync
      ignoreDifferences:
        - kind: Secret
          name: hub
          namespace: jupyterhub
          jsonPointers:
            - /data/hub.config.ConfigurableHTTPProxy.auth_token
            - /data/hub.config.JupyterHub.cookie_secret
            - /data/hub.config.CryptKeeper.keys
        - group: apps
          kind: Deployment
          name: hub
          namespace: jupyterhub
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1secret
        - group: apps
          kind: Deployment
          name: proxy
          namespace: jupyterhub
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1auth-token
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
