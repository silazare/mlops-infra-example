# istiod control plane
pilot:
  autoscaleEnabled: false
  replicaCount: 1
  env:
    # Gateway API Inference Extension (llm-d EPP ext-proc routing)
    ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true"
    SUPPORT_GATEWAY_API_INFERENCE_EXTENSION: "true"
  nodeSelector:
    karpenter.sh/controller: "true"
  tolerations:
    - key: karpenter.sh/controller
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

meshConfig:
  # envoy access logs to stdout > picked up by Alloy and Loki
  accessLogFile: /dev/stdout
