---
crds:
  install: true
  keep: true
  full: false

# Namespaced controller - argo control-plane and workflows in ns argo
singleNamespace: true

# Common tag for all images
images:
  tag: v4.0.5
  pullPolicy: IfNotPresent

controller:
  replicas: 1
  parallelism: 5
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: false
  # Defaults for every workflow: non-root step pods + auto-cleanup.
  workflowDefaults:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      ttlStrategy:
        secondsAfterCompletion: 86400
        secondsAfterSuccess: 3600
        secondsAfterFailure: 259200
      podGC:
        strategy: OnWorkflowSuccess
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

executor:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# Default securityContext for main container in step pods
mainContainer:
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

server:
  enabled: true
  replicas: 1
  servicePort: 2746
  serviceType: ClusterIP
  # client mode: log in to UI with an SA bearer token
  authModes:
    - client
  secure: false
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - argo-workflows.local
    paths:
      - /
    pathType: Prefix
    annotations: {}
    tls: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

workflow:
  serviceAccount:
    create: true
    name: argo-workflow
  rbac:
    create: true

useStaticCredentials: true

extraObjects:
  # UI login identity: SA + token + admin on ns argo
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argo-ui
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: argo-ui-admin
      namespace: argo
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argo-argo-workflows-admin
    subjects:
      - kind: ServiceAccount
        name: argo-ui
        namespace: argo
  - apiVersion: v1
    kind: Secret
    metadata:
      name: argo-ui.service-account-token
      annotations:
        kubernetes.io/service-account.name: argo-ui
    type: kubernetes.io/service-account-token

  # --- Cross-namespace Helm deployer ---
  # Target namespace for test pipelines deploys
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: mlops-pipelines
  # One reusable ClusterRole, then a RoleBinding per target ns granting it to the workflow SA
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: wf-helm-deployer
    rules:
      - apiGroups: [""]
        resources: [secrets, configmaps, services, serviceaccounts, persistentvolumeclaims]
        verbs: ["*"]
      - apiGroups: ["apps"]
        resources: [deployments, statefulsets, daemonsets, replicasets]
        verbs: ["*"]
      - apiGroups: ["batch"]
        resources: [jobs, cronjobs]
        verbs: ["*"]
      - apiGroups: ["networking.k8s.io"]
        resources: [ingresses, networkpolicies]
        verbs: ["*"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: [roles, rolebindings]
        verbs: ["*"]
      - apiGroups: ["autoscaling"]
        resources: [horizontalpodautoscalers]
        verbs: ["*"]
      - apiGroups: ["policy"]
        resources: [poddisruptionbudgets]
        verbs: ["*"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: argo-workflow-helm
      namespace: mlops-pipelines
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: wf-helm-deployer
    subjects:
      - kind: ServiceAccount
        name: argo-workflow
        namespace: argo
