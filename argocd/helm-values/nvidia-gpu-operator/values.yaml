---
# Operator builds and loads the kernel module on the node
# Set to false if the AMI has the driver preinstalled
driver:
  enabled: true
  # https://catalog.ngc.nvidia.com/orgs/nvidia/containers/driver/tags
  version: "595.91.07"
  repository: nvcr.io/nvidia
  image: driver
  # Compiles driver on the node from kernel-devel
  usePrecompiled: false
  upgradePolicy:
    # options for waiting on pod completions before deleting GPU pods on a node the upgrade
    waitForCompletion:
      timeoutSeconds: 14400 # 4 hours
      podSelector: "nvidia.com/upgrade-wait=true"
    # options for gpu pod deletion
    gpuPodDeletion:
      # delete GPU pods without an owner, otherwise upgrade may stuck
      force: true
      # GPU pods mount emptyDir (dshm), without this the upgrade controller refuses to delete them
      deleteEmptyDir: true
  manager:
    env:
      # For DRA: before a driver upgrade the driver-manager flips this node label, so any DaemonSet whose
      # nodeSelector uses it (the standalone DRA kubelet plugin) gets evicted and releases the kernel module
      # The DRA chart's kubeletPlugin.nodeSelector must use the same label, otherwise the upgrade stuck
      - name: NODE_LABEL_FOR_GPU_POD_EVICTION
        value: nvidia.com/gpu.present

# Patches containerd config and installs nvidia-container-runtime on the node.
# Set to false if the AMI already has the toolkit
toolkit:
  enabled: true

# Propagate toleration to all DaemonSets
# Required because the Karpenter `gpu` NodePool taints with nvidia.com/gpu=true:NoSchedule
daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# Exposes nvidia.com/gpu as a schedulable resource
# Device plugin is replaced by the DRA kubelet plugin (nvidia-dra-driver) on every GPU node
# nvidia.com/gpu requests are served by the DRA bridge
devicePlugin:
  enabled: false

# GPU partitioning
mig:
  strategy: none
migManager:
  enabled: false
vgpuManager:
  enabled: false
vgpuDeviceManager:
  enabled: false
sandboxWorkloads:
  enabled: false

dcgmExporter:
  enabled: true
  # Custom metrics set, ConfigMap from argocd/manifests/nvidia-gpu-operator/
  config:
    name: dcgm-metrics-custom
  # DRA pod attribution: the exporter reads DRA allocations from kubelet PodResources
  # Device-plugin allocations keep working through the same API.
  env:
    - name: KUBERNETES_ENABLE_DRA
      value: "true"
  # Adds the pod_uid label
  enablePodUID: true
  # Scrape via kube-prometheus-stack
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 25s
    relabelings:
      # Kubernetes node name on every series (Hostname label is set by dcgm-exporter itself)
      - sourceLabels:
          - __meta_kubernetes_pod_node_name
        targetLabel: node
        action: replace

# Adds GPU-specific node labels
gfd:
  enabled: true

# Bundled NFD
nfd:
  enabled: true
# NFD worker to reach every GPU node
node-feature-discovery:
  worker:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: ""
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

# Operator controller
operator:
  replicas: 1
