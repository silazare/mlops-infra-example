---
kubelet:
  enabled: true
  namespace: kube-system
  serviceMonitor:
    cAdvisor: true # Enable container metrics
    probes: true
    resource: true
    resourcePath: "/metrics/resource"
    https: true # Critical for EKS

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

defaultRules:
  create: true
  rules:
    alertmanager: true
    configReloaders: true
    etcd: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubeProxy: true
    kubeScheduler: true
    kubeStateMetrics: true
    kubelet: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
global:
  rbac:
    create: true
grafana:
  ## This is not for production
  adminPassword: prom-operator123!
  deploymentStrategy:
    type: Recreate
  enabled: true
  grafana.ini:
    server:
      domain: grafana.local
      root_url: http://grafana.local/
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
    - grafana.local
    path: /
  persistence:
    storageClassName: "gp3"
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 1Gi
  plugins: []
  ## Drop the bundled kubernetes-mixin dashboards — replaced by dotdc/grafana-dashboards-kubernetes
  defaultDashboardsEnabled: false
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
  ## Configure additional grafana datasources (passed through tpl)
  ## ref: http://docs.grafana.org/administration/provisioning/#datasources
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local/

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        ## https://github.com/dotdc/grafana-dashboards-kubernetes
        - name: grafana-dashboards-kubernetes
          orgId: 1
          folder: Kubernetes
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
        - name: istio
          orgId: 1
          folder: Istio
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/istio
        ## Locally maintained JSONs from argocd/helm-values/kube-prometheus-stack/dashboards/
        - name: mlops
          orgId: 1
          folder: MLOps
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/mlops
  dashboards:
    ## Pinned to a release tag
    grafana-dashboards-kubernetes:
      k8s-views-global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-global.json
        token: ''
      k8s-views-namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-namespaces.json
        token: ''
      k8s-views-nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-nodes.json
        token: ''
      k8s-views-pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-pods.json
        token: ''
      k8s-system-api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-system-api-server.json
        token: ''
      k8s-system-coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-system-coredns.json
        token: ''
      k8s-addons-prometheus:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-addons-prometheus.json
        token: ''
    default:
      loki-kubernetes-logs-15141:
        gnetId: 15141
        revision: 1
        datasource:
          - name: DS_LOKI
            value: loki
    # Official Istio dashboards
    istio:
      istio-mesh-7639:
        gnetId: 7639
        revision: 317
        datasource: Prometheus
      istio-service-7636:
        gnetId: 7636
        revision: 316
        datasource: Prometheus
      istio-workload-7630:
        gnetId: 7630
        revision: 317
        datasource: Prometheus
      istio-control-plane-7645:
        gnetId: 7645
        revision: 316
        datasource: Prometheus
    # Fetched from the repo by the download-dashboards init container
    # No auto-sync need Grafana POD restart after change
    mlops:
      nvidia-dcgm-exporter:
        url: https://raw.githubusercontent.com/silazare/mlops-infra-example/master/argocd/helm-values/kube-prometheus-stack/dashboards/nvidia-dcgm-exporter.json
        token: ''
      # llm-d official: EPP / InferencePool view
      llm-d-inference-gateway:
        url: https://raw.githubusercontent.com/silazare/mlops-infra-example/master/argocd/helm-values/kube-prometheus-stack/dashboards/llm-d-inference-gateway.json
        token: ''
      # vLLM official: TTFT, TPOT, throughput, cache hit rate
      vllm:
        url: https://raw.githubusercontent.com/silazare/mlops-infra-example/master/argocd/helm-values/kube-prometheus-stack/dashboards/vllm.json
        token: ''

prometheusOperator:
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
      securityContext:
        fsGroup: 65534
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.local
    path: /
  alertmanagerSpec:
    logLevel: info
    storage:
     volumeClaimTemplate:
       spec:
         storageClassName: gp3
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 1Gi
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
    - prometheus.local
    path: /
  prometheusSpec:
    enableAdminAPI: true
    logLevel: info
    ## How long to retain Prometheus metrics
    retention: 1d
    ## Pick up ALL ServiceMonitors/PodMonitors/Rules cluster-wide, not only labelled release: kube-prometheus-stack
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  additionalServiceMonitors: []
