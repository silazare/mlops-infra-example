# Grafana Alloy Helm values for collecting basic system metrics
#
# This configuration sets up Alloy as a DaemonSet to collect node, kubelet, and container metrics
# directly from kubelet endpoints, serving as an alternative to traditional node_exporter setup

alloy:
  # Per-pod NODE_NAME from downward API used in config.alloy to filter discovery to the local node only (each DaemonSet pod scrapes/tails its own node).
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  # Mount host /, /proc, /sys read-only into the alloy container so prometheus.exporter.unix can read real node stats
  mounts:
    extra:
      - name: rootfs
        mountPath: /host/root
        readOnly: true
      - name: procfs
        mountPath: /host/proc
        readOnly: true
      - name: sysfs
        mountPath: /host/sys
        readOnly: true

  # Required to read host /proc /sys; root, not privileged
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    privileged: false

  configMap:
    create: true
    content: |
      // ===== Metrics pipeline: discover nodes > scrape kubelet > ship to Mimir =====

      // This configuration collects CPU, memory, disk, and container metrics from Kubernetes nodes
      // and sends them to Mimir for storage
      
      // Logging configuration - adjust level as needed (debug, info, warn, error)
      logging {
        level = "info"
        format = "logfmt"
      }
      
      // Discover all nodes in the cluster for metric collection
      // This single discovery block is more efficient than multiple separate ones
      discovery.kubernetes "nodes" {
        role = "node"
      }

      // Keep only the local node — Alloy is a DaemonSet, each pod scrapes its own kubelet.
      // Without this filter every Alloy pod scrapes every kubelet → duplicate samples → mimir rejects out-of-order.
      discovery.relabel "local_node" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("NODE_NAME")
          action        = "keep"
        }
      }

      // Collect kubelet metrics (includes node-level system metrics)
      // These metrics include: node_cpu_*, node_memory_*, node_filesystem_*, kubelet_*
      prometheus.scrape "kubelet_metrics" {
        targets = discovery.relabel.local_node.output
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name = "alloy/kubelet"
        
        // Kubelet metrics endpoint - provides node-level metrics
        metrics_path = "/metrics"
        scheme = "https"  // Kubelet typically uses HTTPS
        scrape_interval = "60s"
        scrape_timeout = "30s"
        
        // Authentication for kubelet endpoint
        // Uses service account token for secure access
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true  // Skip cert verification for kubelet self-signed certs
        }
        
        // Optional: Add metric relabeling to keep only essential metrics
        // Uncomment and customize based on your needs
        // metric_relabel_configs {
        //   source_labels = ["__name__"]
        //   regex = "(node_cpu_seconds_total|node_memory_.*|node_filesystem_.*|kubelet_.*)"
        //   action = "keep"
        // }
      }
      
      // Collect cAdvisor metrics for container and pod-level metrics
      // These metrics include: container_*, pod_*, kubelet_volume_*
      prometheus.scrape "cadvisor_metrics" {
        targets = discovery.relabel.local_node.output
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name = "alloy/cadvisor"
        
        // cAdvisor metrics endpoint - provides container metrics
        metrics_path = "/metrics/cadvisor"
        scheme = "https"
        scrape_interval = "60s"
        scrape_timeout = "30s"
        
        // Authentication for kubelet cAdvisor endpoint
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        
        // Optional: Filter out high-cardinality metrics to reduce storage
        // metric_relabel_configs {
        //   source_labels = ["__name__"]
        //   regex = "(container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_fs_.*|pod_.*)"
        //   action = "keep"
        // }
      }
      
      // Send all collected metrics to Mimir
      // Adjust the endpoint URL to match your Mimir installation
      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir-gateway.monitoring.svc/api/v1/push"
        }
        external_labels = {
          cluster = "mltest",
        }
        
        // Optional: Configure batching and retry behavior
        // queue_config {
        //   capacity = 10000
        //   max_samples_per_send = 2000
        //   batch_send_deadline = "5s"
        // }
      }
      
      // Optional: Collect Alloy's own metrics for monitoring the collector itself
      prometheus.scrape "self" {
        targets = [{"__address__" = "localhost:12345", "__metrics_path__" = "/metrics"}]
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name = "alloy/self"
        scrape_interval = "60s"
      }

      // ===== node_exporter: host-level metrics from /host/proc, /host/sys, /host/root =====
      
      // hostPath mounts are wired via top-level `controller.volumes.extra` + `alloy.mounts.extra`.
      // Without these paths, exporter would read the container's own /proc and produce wrong data.
      prometheus.exporter.unix "node" {
        rootfs_path = "/host/root"
        procfs_path = "/host/proc"
        sysfs_path  = "/host/sys"

        disable_collectors = ["ipvs", "btrfs", "infiniband", "xfs", "zfs"]
        enable_collectors  = ["meminfo"]

        filesystem {
          fs_types_exclude     = "^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
          mount_points_exclude = "^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
          mount_timeout        = "5s"
        }

        netclass {
          ignored_devices = "^(veth.*|cali.*|[a-f0-9]{15})$"
        }

        netdev {
          device_exclude = "^(veth.*|cali.*|[a-f0-9]{15})$"
        }
      }

      discovery.relabel "node_exporter" {
        targets = prometheus.exporter.unix.node.targets
        rule {
          target_label = "job"
          replacement  = "integrations/node_exporter"
        }
        rule {
          target_label = "instance"
          replacement  = sys.env("NODE_NAME")
        }
      }

      prometheus.scrape "node_exporter" {
        targets         = discovery.relabel.node_exporter.output
        forward_to      = [prometheus.remote_write.mimir.receiver]
        scrape_interval = "60s"
      }

      // ===== Logs pipeline: discover pods > tail via kubelet > ship to Loki =====

      // Discover only pods on the local node (DaemonSet → 1 pod per node).
      // Field selector pushes the filter to the API server — much cheaper than client-side relabel.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Promote standard pod metadata to Loki labels
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        // Modern charts use app.kubernetes.io/name; fall back to legacy `app`.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator     = ";"
          regex         = "([^;]+).*"
          target_label  = "app"
          replacement   = "$1"
        }
      }

      // Tail container logs via kubelet
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.loki.receiver]
      }

      // Send all collected logs to Loki single-binary gateway
      loki.write "loki" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc/loki/api/v1/push"
        }
        external_labels = {
          cluster = "mltest",
        }
      }

# Pod-level controller config override hostNetwork + dnsPolicy + hostPath volumes for node_exporter
controller:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  volumes:
    extra:
      - name: rootfs
        hostPath:
          path: /
      - name: procfs
        hostPath:
          path: /proc
      - name: sysfs
        hostPath:
          path: /sys

# Service account configuration
# Required for Kubernetes API access and metric collection
serviceAccount:
  create: true
  name: "alloy"

# RBAC configuration
# Permissions required for Kubernetes discovery and metric collection
rbac:
  create: true
  rules:
    # Basic Kubernetes discovery permissions
    - apiGroups: [""]
      resources: ["nodes", "pods", "services", "endpoints"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/metrics", "nodes/proxy"]
      verbs: ["get"]
    # Required for loki.source.kubernetes
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]

# Resource limits for Alloy
# Adjust based on your cluster size and metric volume
resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "256Mi"
    cpu: "250m"

# Service configuration for Alloy metrics endpoint
service:
  enabled: true
  type: ClusterIP
  port: 12345

# Monitoring configuration
# Enable if you want to monitor Alloy itself with ServiceMonitor (Prometheus Operator)
serviceMonitor:
  enabled: false

# Pod disruption budget
# Useful for maintaining availability during cluster updates
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1
