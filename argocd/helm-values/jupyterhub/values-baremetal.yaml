---
# Bare-metal prototype of values.yaml — static nodes, no Cloud and Karpenter.
#
# Adapt before use on real baremetal:
#   - nodeSelector `nodegroup=ubuntu` + tolerations → your static node labels (or drop if single pool)
#   - storage `gp3` / ebs.csi → your CSI (LINSTOR / local-path / NFS);

# JupyterHub control plane (spawns/proxies user servers)
hub:
  # Hub state DB.
  # Single DB for non-production.
  db:
    type: sqlite-pvc
    pvc:
      storageClassName: gp3
      storage: 1Gi
  nodeSelector:
    nodegroup: ubuntu
  tolerations:
    - key: nodegroup
      operator: Equal
      value: ubuntu
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # ---------------------------------------------------------------------------
  # AUTH — Keycloak OIDC for authN; authZ (who logs in / who is admin) is by the
  # username lists below, managed here in git — no KC groups/attributes needed.
  # ---------------------------------------------------------------------------
  config:
    JupyterHub:
      authenticator_class: generic-oauth
    GenericOAuthenticator:
      login_service: "Keycloak"              # label on the login button
      # client_id / client_secret / callback / endpoint URLs come from hub.extraEnv
      # below (oauthenticator reads OAUTH_* / OAUTH2_*), so no secret lands in git.
      username_claim: preferred_username     # stable; becomes the PVC name claim-<user>
      scope: ["openid", "profile"]           # no groups claim required
      enable_auth_state: true                # store the OIDC token in the hub DB
    Authenticator:
      allow_all: false                       # fail-closed: only allowed_users below
      admin_users:
        - i.ivanov
      allowed_users:
        - i.ivanov
        - p.petrov

  # OIDC creds + endpoints from a k8s Secret (SealedSecrets / External Secrets / Vault
  # — never a plaintext Secret in git). Keys: client-id, client-secret.
  extraEnv:
    OAUTH_CLIENT_ID:
      valueFrom: { secretKeyRef: { name: jupyterhub-oidc, key: client-id } }
    OAUTH_CLIENT_SECRET:
      valueFrom: { secretKeyRef: { name: jupyterhub-oidc, key: client-secret } }
    OAUTH_CALLBACK_URL:   "https://jupyter.example.com/hub/oauth_callback"
    OAUTH2_AUTHORIZE_URL: "https://kc.example.com/realms/REALM/protocol/openid-connect/auth"
    OAUTH2_TOKEN_URL:     "https://kc.example.com/realms/REALM/protocol/openid-connect/token"
    OAUTH2_USERDATA_URL:  "https://kc.example.com/realms/REALM/protocol/openid-connect/userinfo"

  # ---------------------------------------------------------------------------
  # Per-user slicing — all keyed on username, managed here in git (no KC needed).
  # `profiles` = which compute tiers a user sees; `quota` = that user's disk size.
  # Compute (CPU/mem/GPU/image) lives in the profile, disk lives in the quota hook —
  # so the two are managed independently per user.
  # ---------------------------------------------------------------------------
  extraConfig:
    # PROFILES — menu shown at spawn. SMALL for everyone; LARGE/GPU only for POWER
    # usernames. GPU needs the NVIDIA GPU Operator (else nvidia.com/gpu = Pending)
    # and a CUDA image (minimal won't use the GPU).
    profiles: |
      SMALL = {
          "display_name": "Small — 1 CPU / 2G",
          "default": True,
          "kubespawner_override": {"cpu_guarantee": 0.5, "cpu_limit": 1,
                                   "mem_guarantee": "2G", "mem_limit": "2G"},
      }
      LARGE = {
          "display_name": "Large — 8 CPU / 32G",
          "kubespawner_override": {"cpu_guarantee": 2, "cpu_limit": 8,
                                   "mem_guarantee": "16G", "mem_limit": "32G"},
      }
      GPU = {
          "display_name": "GPU — 1 GPU / 8 CPU / 64G",
          "kubespawner_override": {
              "node_selector": {"nodegroup": "gpu"},        # your GPU node label
              "tolerations": [{"key": "nvidia.com/gpu", "operator": "Equal",
                               "value": "true", "effect": "NoSchedule"}],
              "extra_resource_limits": {"nvidia.com/gpu": "1"},
              "cpu_guarantee": 2, "cpu_limit": 8,
              "mem_guarantee": "32G", "mem_limit": "64G",
              "image": "<registry>/jupyterlab-cuda:<tag>",  # CUDA image
              "start_timeout": 1200,
          },
      }
      PROFILES = {                       # username → profiles they may pick
          "i.ivanov": [SMALL, LARGE, GPU],
          "p.petrov": [SMALL],
      }
      def dynamic_profiles(spawner):
          return PROFILES.get(spawner.user.name, [SMALL])   # default: SMALL only
      c.KubeSpawner.profile_list = dynamic_profiles

    # QUOTA — per-user PVC size. Runs after profile pick, overrides storage_capacity.
    # Size is set at PVC CREATION only; raising it later won't grow an existing
    # claim-<user> (expand by hand if the CSI allows; shrink never).
    quota: |
      QUOTA = {                          # username → disk size
          "i.ivanov": "100Gi",
          "p.petrov": "10Gi",
      }
      def pre_spawn(spawner):
          spawner.storage_capacity = QUOTA.get(spawner.user.name, "10Gi")
      c.KubeSpawner.pre_spawn_hook = pre_spawn

# Configurable-http-proxy routing traffic to Hub + user pods
proxy:
  # ClusterIP — Traefik Ingress fronts it
  service:
    type: ClusterIP
  chp:
    nodeSelector:
      nodegroup: ubuntu
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

# Per-user notebook server pods (KubeSpawner template)
singleuser:
  # Modern UI: JupyterLab on the jupyter_server backend.
  defaultUrl: /lab
  extraEnv:
    JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
  nodeSelector:
    nodegroup: ubuntu
  extraTolerations:
    - key: nodegroup
      operator: Equal
      value: ubuntu
      effect: NoSchedule
  # Persistent home dir per user — one PVC per user, mounted at /home/jovyan.
  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: gp3
      pvcNameTemplate: claim-{username}{servername}
      volumeNameTemplate: volume-{username}{servername}
    homeMountPath: /home/jovyan
  # Resource guarantees (requests) and limits. guarantee==request, limit caps burst.
  cpu:
    guarantee: 0.25
    limit: 1
  memory:
    guarantee: 1G
    limit: 2G
  # Default notebook image
  image:
    name: quay.io/jupyter/minimal-notebook
    tag: "2024-10-14"
  # Lower than cloud (was 600). Static node is always up
  startTimeout: 120

# Scheduling — DISABLED for static nodes. This block exists for cloud autoscaling.
scheduling:
  # WHY off: the bin-packing scheduler crams user pods onto fewest nodes so the
  # autoscaler can delete emptied ones. Static nodes never scale down
  userScheduler:
    enabled: false
  # WHY off: priority's main job here is letting a real user pod preempt a
  # placeholder. No placeholders below → nothing to preempt → not needed.
  podPriority:
    enabled: false
  # WHY off: placeholders hold warm spare capacity so a spawn doesn't wait for the
  # autoscaler to boot a node. On static nodes the capacity is already present.
  userPlaceholder:
    enabled: false
    replicas: 0
  corePods:
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
  userPods:
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule

# Cull — KEPT. Not a cloud-only optimisation. On static nodes it still reclaims
# CPU/RAM/GPU from idle servers back to the fixed pool for other users.
cull:
  enabled: true
  timeout: 3600      # cull a server idle for 1h
  every: 300         # check every 5m
  maxAge: 0          # 0 = no hard max lifetime, only idleness
  # users: false     # set true to also delete idle *users* (needs admin:users role)

# prePuller — image pre-pull
prePuller:
  # KEPT: pre-upgrade hook pulls the new image onto nodes when the tag changes,
  # so the first post-upgrade spawn isn't blocked on a fresh pull.
  hook:
    enabled: true
    nodeSelector:
      nodegroup: ubuntu
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
  # WHY off: the continuous DaemonSet keeps the image warm on newly-joined nodes.
  # Static nodes don't come and go, and their container cache persists — after the
  # first pull the image is already local forever. A standing DaemonSet adds no value.
  continuous:
    enabled: false

# Ingress
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - jupyter.local
  pathType: Prefix
  tls: []
