---
# Bare-metal prototype of values.yaml — static nodes, no Cloud and Karpenter.
#
# Adapt before use on real baremetal:
#   - nodeSelector `nodegroup=ubuntu` + tolerations → your static node labels (or drop if single pool)
#   - storage `gp3` / ebs.csi → your CSI (LINSTOR / local-path / NFS);

# JupyterHub control plane (spawns/proxies user servers)
hub:
  # Hub state DB.
  # Single DB for non-production.
  db:
    type: sqlite-pvc
    pvc:
      storageClassName: gp3
      storage: 1Gi
  nodeSelector:
    nodegroup: ubuntu
  tolerations:
    - key: nodegroup
      operator: Equal
      value: ubuntu
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # ---------------------------------------------------------------------------
  # AUTH — two modes. ACTIVE NOW = DummyAuthenticator (prototype, no real auth).
  # PROD = Keycloak OIDC (block below). To switch: comment the Dummy block,
  # uncomment the GenericOAuthenticator block + the hub.extraEnv block.
  # ---------------------------------------------------------------------------
  # --- MODE A: prototype (current) -------------------------------------------
  #   allowed_users : who may log in (the "user slicing"); admin_users : admin panel.
  config:
    JupyterHub:
      authenticator_class: dummy
    DummyAuthenticator:
      password: "admin123!" # CHANGEME!
    Authenticator:
      admin_users:
        - i.ivanov
      allowed_users:
        - i.ivanov
        - p.petrov

    # --- MODE B: Keycloak OIDC (prod) — uncomment, remove the Dummy block above -
    # JupyterHub:
    #   authenticator_class: generic-oauth   # GenericOAuthenticator from oauthenticator
    # GenericOAuthenticator:
    #   login_service: "Keycloak"            # button label on the login page
    #   # client_id / client_secret / callback / endpoint URLs come from env (see
    #   # hub.extraEnv below) — oauthenticator reads OAUTH_* / OAUTH2_* automatically,
    #   # so NO secret is ever written into this file / git.
    #   username_claim: preferred_username   # stable; becomes the PVC name claim-<user>.
    #                                        # do NOT use a claim that changes in KC.
    #   scope: ["openid", "profile", "groups"]  # KC must emit a `groups` claim (group mapper)
    #   enable_auth_state: true              # store the OIDC token in the hub DB
    #                                        # (needed for token pass-through + manage_groups;
    #                                        #  z2jh supplies the crypt key via Secret `hub`)
    #   # ---- authorization: by Keycloak GROUP, not static lists ----
    #   allow_all: false                     # fail-closed: only the groups below may log in
    #   manage_groups: true                  # sync group membership from the token
    #   auth_state_groups_key: "oauth_user.groups"  # where groups live in the userinfo response
    #   allowed_groups: ["jupyterhub-users"]   # KC group → may log in
    #   admin_groups:   ["jupyterhub-admins"]  # KC group → gets the admin panel
    #   # bootstrap first admin without a password: either put yourself in the KC
    #   # `jupyterhub-admins` group, or seed once: admin_users: ["<your-kc-username>"]

  # --- MODE B cont.: inject OIDC creds + endpoints from a k8s Secret -----------
  # Create Secret `jupyterhub-oidc` via SealedSecrets / External Secrets / Vault —
  # NEVER a plaintext Secret in git. Keys: client-id, client-secret.
  # extraEnv:
  #   OAUTH_CLIENT_ID:
  #     valueFrom: { secretKeyRef: { name: jupyterhub-oidc, key: client-id } }
  #   OAUTH_CLIENT_SECRET:
  #     valueFrom: { secretKeyRef: { name: jupyterhub-oidc, key: client-secret } }
  #   OAUTH_CALLBACK_URL:   "https://jupyter.example.com/hub/oauth_callback"
  #   OAUTH2_AUTHORIZE_URL: "https://kc.example.com/realms/REALM/protocol/openid-connect/auth"
  #   OAUTH2_TOKEN_URL:     "https://kc.example.com/realms/REALM/protocol/openid-connect/token"
  #   OAUTH2_USERDATA_URL:  "https://kc.example.com/realms/REALM/protocol/openid-connect/userinfo"

# Configurable-http-proxy routing traffic to Hub + user pods
proxy:
  # ClusterIP — Traefik Ingress fronts it
  service:
    type: ClusterIP
  chp:
    nodeSelector:
      nodegroup: ubuntu
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

# Per-user notebook server pods (KubeSpawner template)
singleuser:
  # Modern UI: JupyterLab on the jupyter_server backend.
  defaultUrl: /lab
  extraEnv:
    JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
  nodeSelector:
    nodegroup: ubuntu
  extraTolerations:
    - key: nodegroup
      operator: Equal
      value: ubuntu
      effect: NoSchedule
  # Persistent home dir per user — one PVC per user, mounted at /home/jovyan.
  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: gp3
      pvcNameTemplate: claim-{username}{servername}
      volumeNameTemplate: volume-{username}{servername}
    homeMountPath: /home/jovyan
  # Resource guarantees (requests) and limits. guarantee==request, limit caps burst.
  cpu:
    guarantee: 0.25
    limit: 1
  memory:
    guarantee: 1G
    limit: 2G
  # Default notebook image
  image:
    name: quay.io/jupyter/minimal-notebook
    tag: "2024-10-14"
  # Lower than cloud (was 600). Static node is always up
  startTimeout: 120

# Scheduling — DISABLED for static nodes. This block exists for cloud autoscaling.
scheduling:
  # WHY off: the bin-packing scheduler crams user pods onto fewest nodes so the
  # autoscaler can delete emptied ones. Static nodes never scale down
  userScheduler:
    enabled: false
  # WHY off: priority's main job here is letting a real user pod preempt a
  # placeholder. No placeholders below → nothing to preempt → not needed.
  podPriority:
    enabled: false
  # WHY off: placeholders hold warm spare capacity so a spawn doesn't wait for the
  # autoscaler to boot a node. On static nodes the capacity is already present.
  userPlaceholder:
    enabled: false
    replicas: 0
  corePods:
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
  userPods:
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule

# Cull — KEPT. Not a cloud-only optimisation. On static nodes it still reclaims
# CPU/RAM/GPU from idle servers back to the fixed pool for other users.
cull:
  enabled: true
  timeout: 3600      # cull a server idle for 1h
  every: 300         # check every 5m
  maxAge: 0          # 0 = no hard max lifetime, only idleness
  # users: false     # set true to also delete idle *users* (needs admin:users role)

# prePuller — image pre-pull
prePuller:
  # KEPT: pre-upgrade hook pulls the new image onto nodes when the tag changes,
  # so the first post-upgrade spawn isn't blocked on a fresh pull.
  hook:
    enabled: true
    nodeSelector:
      nodegroup: ubuntu
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
  # WHY off: the continuous DaemonSet keeps the image warm on newly-joined nodes.
  # Static nodes don't come and go, and their container cache persists — after the
  # first pull the image is already local forever. A standing DaemonSet adds no value.
  continuous:
    enabled: false

# Ingress
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - jupyter.local
  pathType: Prefix
  tls: []
