---
# JupyterHub control plane (spawns/proxies user servers)
hub:
  # Hub state DB.
  # Single DB for non-production.
  db:
    type: sqlite-pvc
    upgrade: true          # auto-migrate DB schema on chart/JupyterHub version bump
    pvc:
      storageClassName: gp3
      storage: 1Gi
  # One server per user (no multi-server UI)
  allowNamedServers: false
  # Pin Hub to the ubuntu Karpenter pool (label) + tolerate its taint.
  nodeSelector:
    nodegroup: ubuntu
  tolerations:
    - key: nodegroup
      operator: Equal
      value: ubuntu
      effect: NoSchedule
  # Small footprint for testing
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Auth and user management — non-production
  # How to manage users:
  #   allowed_users : who may log in at all (the "user slicing"). Add/remove here.
  #   admin_users   : subset with the admin panel (start/stop others' servers).
  config:
    JupyterHub:
      authenticator_class: dummy
      shutdown_on_logout: true   # stop the user's server on logout (free resources)
    DummyAuthenticator:
      password: "admin123!" # CHANGEME!
    Authenticator:
      admin_users:
        - i.ivanov
      allowed_users:
        - i.ivanov
        - p.petrov
  # Per-USER disk quota — profiles are per-spawn/per-group, this is per-username.
  # pre_spawn_hook runs after profile selection and overrides storage_capacity, so two
  # users in the same group get different PVC sizes. Applies AT PVC CREATION only — an
  # existing claim-<user> won't auto-grow if you raise the quota later (resize gp3 by hand).
  extraConfig:
    quota: |
      QUOTA = {            # username → PVC size
          "i.ivanov": "100Gi",
          "p.petrov": "10Gi",
      }
      def pre_spawn(spawner):
          spawner.storage_capacity = QUOTA.get(spawner.user.name, "10Gi")  # default for the rest
      c.KubeSpawner.pre_spawn_hook = pre_spawn

# Configurable-http-proxy routing traffic to Hub + user pods
proxy:
  # ClusterIP — Traefik Ingress fronts it
  service:
    type: ClusterIP
  chp:
    nodeSelector:
      nodegroup: ubuntu
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

# Per-user notebook server pods (KubeSpawner template)
singleuser:
  # Modern UI: JupyterLab on the jupyter_server backend.
  defaultUrl: /lab
  extraEnv:
    JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
  # Pin user pods to the ubuntu pool and tolerate its taint
  nodeSelector:
    nodegroup: ubuntu
  extraTolerations:
    - key: nodegroup
      operator: Equal
      value: ubuntu
      effect: NoSchedule
  # Persistent home dir per user — dynamic gp3 PVC, one per user, mounted at /home/jovyan.
  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: gp3
      pvcNameTemplate: claim-{username}{servername}
      volumeNameTemplate: volume-{username}{servername}
    homeMountPath: /home/jovyan
  # Resource guarantees (requests) and limits. guarantee==request, limit caps burst.
  cpu:
    guarantee: 0.25
    limit: 1
  memory:
    guarantee: 1G
    limit: 2G
  # Default notebook image
  image:
    name: quay.io/jupyter/minimal-notebook
    tag: "2024-10-14"
  # Give the spawn a generous timeout first pull on a fresh Karpenter node is slow.
  startTimeout: 600
  # Profiles list
  profileList:
    - display_name: "CPU Only"
      description: "Pick image and resource tier below."
      default: true
      profile_options:
        image:
          display_name: "Image"
          choices:
            minimal:
              display_name: "Minimal Notebook"
              default: true
              kubespawner_override:
                image: "quay.io/jupyter/minimal-notebook:2024-10-14"
            scipy:
              display_name: "SciPy Notebook"
              kubespawner_override:
                image: "quay.io/jupyter/scipy-notebook:2024-10-14"
        resources:
          display_name: "Resource Allocation"
          choices:
            small:
              display_name: "1 CPU / 2Gb RAM"
              default: true
              # cpu: 0.25 reserved, burst to 1. mem: 1G reserved, burst to 2G
              kubespawner_override:
                cpu_guarantee: 0.25
                cpu_limit: 1
                mem_guarantee: 1G
                mem_limit: 2G
            medium:
              display_name: "2 CPU / 4Gb RAM"
              # cpu: 0.5 reserved, burst to 2. mem: 2G reserved, burst to 4G
              kubespawner_override:
                cpu_guarantee: 0.5
                cpu_limit: 2
                mem_guarantee: 2G
                mem_limit: 4G
            large:
              display_name: "4 CPU / 16Gb RAM"
              # cpu: 1 reserved, burst to 4. mem: 8G reserved, burst to 16G
              kubespawner_override:
                cpu_guarantee: 1
                cpu_limit: 4
                mem_guarantee: 8G
                mem_limit: 16G
    # GPU tier on the ubuntu-gpu Karpenter pool (own card — node_selector + toleration differ)
    - display_name: "GPU"
      description: "CUDA notebook on a GPU node."
      kubespawner_override:
        node_selector:
          nodegroup: ubuntu-gpu
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule
        extra_resource_limits:
          nvidia.com/gpu: "1"
        cpu_guarantee: 2
        cpu_limit: 8
        mem_guarantee: 16G
        mem_limit: 32G
        image: "576087096890.dkr.ecr.eu-west-1.amazonaws.com/jupyterlab-llm:25.01"
        start_timeout: 1200   # GPU node spin-up + large CUDA image pull

# Scheduling — cost/packing optimisations
scheduling:
  # Dedicated scheduler packs user pods tightly onto fewer nodes
  userScheduler:
    enabled: true
    # Chart default is 2 (HA leader-election)
    replicas: 1
    nodeSelector:
      nodegroup: ubuntu
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
  # Priority so user pods can preempt placeholders
  podPriority:
    enabled: true
  # Warm "placeholder" pods hold spare capacity so a real user spawn doesn't wait
  # for a cold Karpenter node. Each placeholder is evicted when a user needs the room.
  # Keep at 1 in sandbox (0 = no warm capacity, pure on-demand scale-up).
  userPlaceholder:
    enabled: true
    replicas: 1
  # corePods → hub/proxy/scheduler ; userPods → singleuser/placeholder.
  corePods:
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
    nodeAffinity:
      matchNodePurpose: prefer
  userPods:
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
    nodeAffinity:
      matchNodePurpose: prefer

# Cull — reclaim idle user servers
cull:
  enabled: true
  timeout: 3600      # cull a server idle for 1h
  every: 300         # check every 5m
  maxAge: 0          # 0 = no hard max lifetime, only idleness
  # users: false     # set true to also delete idle *users* (needs admin:users role)

# prePuller — pre-pull the singleuser image so spawns are fast
prePuller:
  # Pull on each chart upgrade via a pre-upgrade hook.
  hook:
    enabled: true
    nodeSelector:
      nodegroup: ubuntu
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ubuntu
        effect: NoSchedule
  # Continuous puller (DaemonSet) keeps the image warm on every ubuntu node.
  continuous:
    enabled: true

# Ingress
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - jupyter.local
  pathType: Prefix
  tls: []
