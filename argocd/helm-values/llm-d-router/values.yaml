## Shared values for the llm-d router (EPP + InferencePool), model-agnostic.
## Merged from upstream llm-d/llm-d@v0.8.1 (recipes/router/base.values.yaml +
## guides/optimized-baseline/router/optimized-baseline.values.yaml) with OVERRIDES.

router:
  # extra HTTP listener (optimized-baseline) — Service :80 -> envoy :8081
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    replicas: 1
    flags:
      v: 4
    # optimized-baseline scoring profile (was "default-plugins.yaml" in base)
    pluginsConfigFile: "optimized-baseline-plugins.yaml"
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: no-hit-lru-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2
    # OVERRIDE — pin EPP off the floating `-dev:main` chart default
    image:
      repository: llm-d-router-endpoint-picker
      tag: v0.9.0
      pullPolicy: IfNotPresent
    # OVERRIDE — sandbox trim (upstream base asks cpu:4 / 8-16Gi, oversized for small models).
    resources:
      requests:
        cpu: "200m"
        memory: 512Mi
      limits:
        memory: 1Gi

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http # http, grpc
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"
      # llm-d.ai/model is injected per-model by the ApplicationSet inline

  proxy:
    # CLI args for the Envoy sidecar
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "8"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    # OVERRIDE — sandbox trim (upstream base asks cpu:4 / 8-16Gi).
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        memory: 512Mi

  tracing:
    otelExporterEndpoint: "http://localhost:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"
