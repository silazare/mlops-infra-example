---
# Grafana with Mimir as default datasource.

# Admin credentials — non-production
adminUser: admin
adminPassword: admin123!

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.local
  path: /

persistence:
  enabled: true
  size: 5Gi
  storageClassName: "gp3"

resources:
  limits:
    memory: 1Gi
    cpu: 1000m
  requests:
    memory: 512Mi
    cpu: 250m

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        access: proxy
        url: http://mimir-gateway.monitoring.svc/prometheus
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 30s
          queryTimeout: 60s
          httpMethod: POST
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local/
        editable: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default

# Disable label-based discovery to avoid duplicate provisioning
sidecar:
  dashboards:
    enabled: false
    label: grafana_dashboard
    searchNamespace: monitoring
    folder: /var/lib/grafana/dashboards/default

dashboards:
  default:
    # Node Exporter Full (https://grafana.com/grafana/dashboards/1860)
    node-exporter-full-1860:
      gnetId: 1860
      revision: 45
      datasource: Mimir
    # Kubernetes Cluster — cAdvisor based (https://grafana.com/grafana/dashboards/12740)
    kubernetes-cluster-12740:
      gnetId: 12740
      revision: 1
      datasource: Mimir
    # Loki Kubernetes Logs (https://grafana.com/grafana/dashboards/15141)
    loki-kubernetes-logs-15141:
      gnetId: 15141
      revision: 1
      datasource:
        - name: DS_LOKI
          value: loki

rbac:
  create: true

deploymentStrategy:
  type: Recreate

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
