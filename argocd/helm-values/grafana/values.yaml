---
# Grafana with Mimir as default datasource.

# Admin credentials — non-production
adminUser: admin
adminPassword: admin123! # CHANGEME!

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.local
  path: /

persistence:
  enabled: true
  size: 1Gi
  storageClassName: "gp3"

resources:
  limits:
    memory: 1Gi
    cpu: 1000m
  requests:
    memory: 512Mi
    cpu: 250m

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        access: proxy
        url: http://mimir-gateway.monitoring.svc/prometheus
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 30s
          queryTimeout: 60s
          httpMethod: POST
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local/
        editable: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default

# Disable label-based discovery to avoid duplicate provisioning
sidecar:
  dashboards:
    enabled: false
    label: grafana_dashboard
    searchNamespace: monitoring
    folder: /var/lib/grafana/dashboards/default

dashboards:
  default:
    node-exporter-full-1860:
      gnetId: 1860
      revision: 45
      datasource: Mimir
    kubernetes-views-global-15757:
      gnetId: 15757
      revision: 43
      datasource: Mimir
    kubernetes-views-namespaces-15758:
      gnetId: 15758
      revision: 42
      datasource: Mimir
    kubernetes-views-nodes-15759:
      gnetId: 15759
      revision: 37
      datasource: Mimir
    kubernetes-views-pods-15760:
      gnetId: 15760
      revision: 35
      datasource: Mimir
    kubernetes-logs:
      json: |
        {
          "annotations": {
            "list": [
              {
                "builtIn": 1,
                "datasource": {"uid": "-- Grafana --"},
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "target": {"limit": 100, "matchAny": false, "tags": [], "type": "dashboard"},
                "type": "dashboard"
              }
            ]
          },
          "description": "Logs collected from Kubernetes, stored in Loki",
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "links": [],
          "panels": [
            {
              "datasource": {"type": "loki", "uid": "loki"},
              "fieldConfig": {
                "defaults": {
                  "color": {"mode": "palette-classic"},
                  "custom": {
                    "axisBorderShow": false,
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
                    "barWidthFactor": 0.6,
                    "drawStyle": "bars",
                    "fillOpacity": 0,
                    "gradientMode": "none",
                    "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                    "insertNulls": false,
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "pointSize": 5,
                    "scaleDistribution": {"type": "linear"},
                    "showPoints": "auto",
                    "showValues": false,
                    "spanNulls": false,
                    "stacking": {"group": "A", "mode": "none"},
                    "thresholdsStyle": {"mode": "off"}
                  },
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"color": "green", "value": 0},
                      {"color": "red", "value": 80}
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {"h": 4, "w": 24, "x": 0, "y": 0},
              "id": 4,
              "options": {
                "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": false},
                "tooltip": {"hideZeros": false, "mode": "single", "sort": "none"}
              },
              "targets": [
                {
                  "datasource": {"type": "loki", "uid": "loki"},
                  "expr": "sum(count_over_time({namespace=~\"$namespace\", container=~\"$container\"} |= \"$query\" [$__interval]))",
                  "instant": false,
                  "legendFormat": "Log count",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "",
              "type": "timeseries"
            },
            {
              "datasource": {"type": "loki", "uid": "loki"},
              "description": "Logs from services running in Kubernetes",
              "fieldConfig": {"defaults": {}, "overrides": []},
              "gridPos": {"h": 25, "w": 24, "x": 0, "y": 4},
              "id": 2,
              "options": {
                "dedupStrategy": "none",
                "enableInfiniteScrolling": false,
                "enableLogDetails": true,
                "prettifyLogMessage": false,
                "showCommonLabels": false,
                "showControls": false,
                "showLabels": false,
                "showTime": false,
                "sortOrder": "Descending",
                "wrapLogMessage": false
              },
              "targets": [
                {
                  "datasource": {"type": "loki", "uid": "loki"},
                  "expr": "{namespace=~\"$namespace\", container=~\"$container\"} |= \"$query\"",
                  "refId": "A"
                }
              ],
              "title": "",
              "type": "logs"
            }
          ],
          "preload": false,
          "refresh": "",
          "schemaVersion": 42,
          "tags": [],
          "templating": {
            "list": [
              {
                "current": {"text": "", "value": ""},
                "description": "String to search for",
                "label": "Search Query",
                "name": "query",
                "options": [{"selected": true, "text": "", "value": ""}],
                "query": "",
                "type": "textbox"
              },
              {
                "allValue": ".+",
                "current": {"text": ["All"], "value": ["$__all"]},
                "datasource": "loki",
                "definition": "label_values(namespace)",
                "includeAll": true,
                "multi": true,
                "name": "namespace",
                "options": [],
                "query": "label_values(namespace)",
                "refresh": 1,
                "regex": "",
                "type": "query"
              },
              {
                "allValue": ".+",
                "current": {"text": ["All"], "value": ["$__all"]},
                "datasource": "loki",
                "definition": "label_values(container)",
                "includeAll": true,
                "multi": true,
                "name": "container",
                "options": [],
                "query": "label_values(container)",
                "refresh": 1,
                "regex": "",
                "type": "query"
              }
            ]
          },
          "time": {"from": "now-6h", "to": "now"},
          "timepicker": {},
          "timezone": "",
          "title": "Kubernetes Logs",
          "uid": "kubernetes-logs",
          "version": 1
        }

rbac:
  create: true

deploymentStrategy:
  type: Recreate

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
