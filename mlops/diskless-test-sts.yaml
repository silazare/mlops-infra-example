---
apiVersion: v1
kind: Namespace
metadata:
  name: linstor-test
---
apiVersion: v1
kind: Service
metadata:
  name: diskless-test-sts
  namespace: linstor-test
  labels:
    app: diskless-test-sts
spec:
  clusterIP: None
  selector:
    app: diskless-test-sts
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: diskless-test-sts
  namespace: linstor-test
  labels:
    app: diskless-test-sts
spec:
  replicas: 1
  serviceName: diskless-test-sts
  selector:
    matchLabels:
      app: diskless-test-sts
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: diskless-test-sts
    spec:
      nodeSelector:
        nodegroup: ubuntu
      tolerations:
        - key: nodegroup
          operator: Equal
          value: ubuntu
          effect: NoSchedule
      containers:
        - name: writer
          image: alpine:3.20
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              echo "===== existing /data/log (from previous pod incarnations) ====="
              [ -f /data/log ] && cat /data/log || echo "(file empty, fresh PVC)"
              echo "===== writer loop starts ====="
              echo "[$(date -Iseconds)] startup pod=$HOSTNAME node=$NODE_NAME (diskless DRBD client)" | tee -a /data/log
              while true; do
                echo "[$(date -Iseconds)] tick node=$NODE_NAME" | tee -a /data/log
                sync
                sleep 5
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: linstor-hdd-2r
        resources:
          requests:
            storage: 5Gi
