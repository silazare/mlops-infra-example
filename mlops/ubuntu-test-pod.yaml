---
apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-test
  labels:
    app: ubuntu-test
spec:
  restartPolicy: Never
  nodeSelector:
    nodegroup: ubuntu
  tolerations:
    - key: nodegroup
      operator: Equal
      value: ubuntu
      effect: NoSchedule
  containers:
    - name: probe
      image: ubuntu:24.04
      command: ["bash", "-lc"]
      args:
        - |
          set -e
          echo "=== /etc/os-release ==="
          cat /etc/os-release
          echo
          echo "=== uname -a ==="
          uname -a
          echo
          echo "=== df -h / ==="
          df -h /
          echo
          echo "=== sleeping ==="
          sleep 3600
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
