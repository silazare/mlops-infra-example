---
# Istio smoke test
apiVersion: v1
kind: Namespace
metadata:
  name: istio-test
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Pod
metadata:
  name: istio-test
  namespace: istio-test
  labels:
    app: istio-test
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: curlimages/curl:latest
      command: ["sh", "-c"]
      args:
        - |
          set -e
          echo "=== sidecar should appear as a second container (istio-proxy) ==="
          echo "=== curl istiod metrics through the mesh (15014 = monitoring port) ==="
          curl -Is http://istiod.istio-system.svc:15014/metrics
          echo "=== sleeping ==="
          sleep 3600
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
