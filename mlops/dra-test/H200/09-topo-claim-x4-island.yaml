# Explicit claim: 4 full GPUs that must share resource.kubernetes.io/numaNode. On kw20 numaNode == NVLink island
# (== pcieRoot: pci0000:48 / pci0000:c8), so each pod gets a complete NV6 mesh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: topo-x4-island
  namespace: dra-test
data:
  probe.sh: |
    #!/bin/sh
    echo "== pod ${POD_NAME:-?} on ${NODE_NAME:-?}"
    nvidia-smi --query-gpu=index,uuid,pci.bus_id --format=csv,noheader | while IFS=, read i u b; do
      bdf=$(echo "$b" | tr -d ' ' | sed 's/^0000//' | tr 'A-Z' 'a-z')
      echo "GPU$i $(echo $u | tr -d ' ') $bdf numa=$(cat /sys/bus/pci/devices/$bdf/numa_node 2>/dev/null || echo '?')"
    done
    echo "== nvidia-smi topo -m (SYS between any pair = pod straddles two islands)"
    nvidia-smi topo -m
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: x4-island
  namespace: dra-test
spec:
  spec:
    devices:
      requests:
        - name: gpus
          exactly:
            deviceClassName: gpu.nvidia.com
            count: 2
      constraints:
        - requests: ["gpus"]
          matchAttribute: resource.kubernetes.io/numaNode   # alternative on this node shape: resource.kubernetes.io/pcieRoot
---
apiVersion: v1
kind: Pod
metadata:
  name: x4-island-a
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kw20-c205
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: registry-k8s.pyn.ru/k8s/pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
      command: ["sh", "-c", "sh /app/probe.sh; sleep 3600"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: app
          mountPath: /app
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
        claims:
          - name: gpus
  resourceClaims:
    - name: gpus
      resourceClaimTemplateName: x4-island
  volumes:
    - name: app
      configMap:
        name: topo-x4-island
---
apiVersion: v1
kind: Pod
metadata:
  name: x4-island-b
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kw20-c205
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: registry-k8s.pyn.ru/k8s/pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
      command: ["sh", "-c", "sh /app/probe.sh; sleep 3600"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: app
          mountPath: /app
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
        claims:
          - name: gpus
  resourceClaims:
    - name: gpus
      resourceClaimTemplateName: x4-island
  volumes:
    - name: app
      configMap:
        name: topo-x4-island
