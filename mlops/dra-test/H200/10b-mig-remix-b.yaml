---
# phase C: after `kubectl -n dra-test delete pod remix-3g`, these two take the freed 3g worth of counters
# as 2g.35gb + 1g.18gb. Templates mig-2g / mig-1g come from 10-mig-remix.yaml.
# Expect: both Running; remix-1g-a / remix-1g-b untouched (same start time, restartCount 0);
# node `nvidia-smi mig -lgi` shows 2g + 1g + 1g + 1g.
apiVersion: v1
kind: Pod
metadata:
  name: remix-2g
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kw3-c205
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/dra
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu24.04
      command: ["sh", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
        claims:
          - name: mig
  resourceClaims:
    - name: mig
      resourceClaimTemplateName: mig-2g
---
apiVersion: v1
kind: Pod
metadata:
  name: remix-1g-c
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kw3-c205
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/dra
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu24.04
      command: ["sh", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
        claims:
          - name: mig
  resourceClaims:
    - name: mig
      resourceClaimTemplateName: mig-1g
