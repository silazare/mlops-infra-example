---
# fill one H200 with 1g.18gb slices. 7 fit; the 8th replica must stay Pending with a scheduler event,
# not fail in prepare. Scale down to 0 afterwards and confirm `nvidia-smi mig -lgi` on the node is empty.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-1g-18gb
  namespace: dra-test
spec:
  spec:
    devices:
      requests:
        - name: mig
          exactly:
            deviceClassName: mig.nvidia.com
            selectors:
              - cel:
                  expression: device.attributes["gpu.nvidia.com"].profile == "1g.18gb"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mig-fill
  namespace: dra-test
spec:
  replicas: 8
  selector:
    matchLabels:
      app: mig-fill
  template:
    metadata:
      labels:
        app: mig-fill
    spec:
      nodeSelector:
        kubernetes.io/hostname: kw20-c205
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/dra
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cuda
          image: registry-k8s.pyn.ru/k8s/pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
          command: ["sh", "-c", "nvidia-smi -L; nvidia-smi; sleep infinity"]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
            claims:
              - name: mig
      resourceClaims:
        - name: mig
          resourceClaimTemplateName: mig-1g-18gb
