---
# any MIG slice, no selector. Dynamic MIG creates the partition on prepare.
# Expect: Running; `nvidia-smi -L` inside shows a MIG device; on the node `nvidia-smi mig -lgi` lists one GI.
# After `kubectl delete pod mig-any` the GI disappears
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-any
  namespace: dra-test
spec:
  spec:
    devices:
      requests:
        - name: mig
          exactly:
            deviceClassName: mig.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-any
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kw20-c205
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/dra
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: registry-k8s.pyn.ru/k8s/pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
      command: ["sh", "-c", "nvidia-smi -L; nvidia-smi; sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
        claims:
          - name: mig
  resourceClaims:
    - name: mig
      resourceClaimTemplateName: mig-any
