# Legacy request through the DRA bridge: 4 GPUs, no claim, no constraint. The allocator is first-fit, so the set
# may straddle the two NVLink islands.
# Expect: probe shows numa=0 and numa=1 mixed and SYS in topo -m.
apiVersion: v1
kind: ConfigMap
metadata:
  name: topo-legacy-x4
  namespace: dra-test
data:
  probe.sh: |
    #!/bin/sh
    echo "== pod ${POD_NAME:-?} on ${NODE_NAME:-?}"
    nvidia-smi --query-gpu=index,uuid,pci.bus_id --format=csv,noheader | while IFS=, read i u b; do
      bdf=$(echo "$b" | tr -d ' ' | sed 's/^0000//' | tr 'A-Z' 'a-z')
      echo "GPU$i $(echo $u | tr -d ' ') $bdf numa=$(cat /sys/bus/pci/devices/$bdf/numa_node 2>/dev/null || echo '?')"
    done
    echo "== nvidia-smi topo -m (SYS between any pair = pod straddles two islands)"
    nvidia-smi topo -m
---
apiVersion: v1
kind: Pod
metadata:
  name: legacy-x4
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kw20-c205
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: registry-k8s.pyn.ru/k8s/pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
      command: ["sh", "-c", "sh /app/probe.sh; sleep 3600"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: app
          mountPath: /app
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "4"
        limits:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "4"
  volumes:
    - name: app
      configMap:
        name: topo-legacy-x4
