---
# Dynamic MIG — the card's layout follows the claims, not the other way round.
# Phase A: apply as is -> three independent pods (3g.40gb + 1g.10gb + 1g.10gb) land on ONE H100, no pre-partitioning.
#          Node: `nvidia-smi mig -lgi` shows 3g + 1g + 1g. Note START TIME of remix-1g-a / remix-1g-b.
# Phase B: `kubectl -n dra-test delete pod remix-3g` -> its GI disappears, the two 1g pods keep running.
# Phase C: apply 10b-mig-remix-b.yaml -> 2g.20gb + 1g.10gb take the freed space. Node now shows 2g + 1g + 1g + 1g.
#          remix-1g-a / remix-1g-b: same start time, restartCount 0 — nobody was evicted, nobody re-partitioned by hand.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-3g
  namespace: dra-test
spec:
  spec:
    devices:
      requests:
        - name: mig
          exactly:
            deviceClassName: mig.nvidia.com
            selectors:
              - cel:
                  expression: device.attributes["gpu.nvidia.com"].profile == "3g.40gb"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-2g
  namespace: dra-test
spec:
  spec:
    devices:
      requests:
        - name: mig
          exactly:
            deviceClassName: mig.nvidia.com
            selectors:
              - cel:
                  expression: device.attributes["gpu.nvidia.com"].profile == "2g.20gb"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-1g
  namespace: dra-test
spec:
  spec:
    devices:
      requests:
        - name: mig
          exactly:
            deviceClassName: mig.nvidia.com
            selectors:
              - cel:
                  expression: device.attributes["gpu.nvidia.com"].profile == "1g.10gb"
---
apiVersion: v1
kind: Pod
metadata:
  name: remix-3g
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    nodegroup: ubuntu-gpu-mig
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu24.04
      command: ["sh", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
        claims:
          - name: mig
  resourceClaims:
    - name: mig
      resourceClaimTemplateName: mig-3g
---
apiVersion: v1
kind: Pod
metadata:
  name: remix-1g-a
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    nodegroup: ubuntu-gpu-mig
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu24.04
      command: ["sh", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
        claims:
          - name: mig
  resourceClaims:
    - name: mig
      resourceClaimTemplateName: mig-1g
---
apiVersion: v1
kind: Pod
metadata:
  name: remix-1g-b
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    nodegroup: ubuntu-gpu-mig
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu24.04
      command: ["sh", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
        claims:
          - name: mig
  resourceClaims:
    - name: mig
      resourceClaimTemplateName: mig-1g
