---
# warm up the MIG pool to make it launch a p5.4xlarge
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: full-gpu
  namespace: dra-test
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-warmup
  namespace: dra-test
spec:
  restartPolicy: Never
  nodeSelector:
    nodegroup: ubuntu-gpu-mig
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu24.04
      command: ["sh", "-c", "nvidia-smi -L; nvidia-smi --query-gpu=name,mig.mode.current --format=csv; sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: full-gpu
