---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  labels:
    app: gpu-test
spec:
  restartPolicy: Never
  nodeSelector:
    nodegroup: ubuntu-gpu
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.0-base-ubuntu24.04
      command: ["sh", "-c"]
      args:
        - |
          echo "=== nvidia-smi ==="
          nvidia-smi
          echo
          echo "=== nvidia-smi -L ==="
          nvidia-smi -L
          echo
          echo "=== Driver version ==="
          cat /proc/driver/nvidia/version
          echo
          echo "=== CUDA toolkit visible to runtime ==="
          ls /usr/local/cuda* 2>/dev/null || echo "(no cuda toolkit in -base image, expected)"
          echo
          echo "=== sleeping ==="
          sleep 3600
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "1"
          memory: "2Gi"
          nvidia.com/gpu: "1"
